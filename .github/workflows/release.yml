# Builds Pasalo for every platform and publishes a GitHub pre-release.
#
# Runs when a tag like v0.1.0-rc1 is pushed (or by hand from the Actions tab).
# Required secrets to sign the Android APK: ANDROID_KEYSTORE_BASE64 and
# ANDROID_KEYSTORE_PASSWORD (key alias "pasalo").

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (it is created if it does not exist)
        required: true
        default: v0.1.0-rc1

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            prerelease=""
            case "$TAG" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Pasalo $TAG" --generate-notes $prerelease
          fi
          echo "id=$(gh release view "$TAG" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"

  desktop:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            rust_targets: ""
          - platform: ubuntu-22.04
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the Tauri CLI
        working-directory: app
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: app
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  android:
    needs: create-release
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          # The default list includes "tools", which the SDK no longer ships.
          packages: platform-tools

      - name: Android NDK
        run: |
          sdkmanager --install "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      # Gradle builds the Rust side with `cargo tauri android android-studio-script`
      # (the project was generated with the cargo CLI), so the npm CLI is not enough.
      - uses: cargo-bins/cargo-binstall@main
      - name: Tauri CLI
        run: cargo binstall -y --locked tauri-cli@2.12.4

      # One APK per architecture: each phone downloads only its own (the
      # universal one carries every native library and weighs twice as much).
      - name: Build the APKs
        working-directory: app/src-tauri
        run: cargo tauri android build --apk --split-per-abi --target aarch64 armv7

      - name: Sign and publish
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          version=$(jq -r .version app/src-tauri/tauri.conf.json)
          # Android refuses to install an unsigned APK ("package invalid").
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD secrets"
            exit 1
          fi
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          outputs=app/src-tauri/gen/android/app/build/outputs/apk
          files=()
          for abi in arm64-v8a armeabi-v7a; do
            unsigned="$outputs/$abi/release/app-$abi-release-unsigned.apk"
            out="Pasalo-$version-android-$abi.apk"
            "$build_tools/zipalign" -f -p 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
            "$build_tools/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias pasalo \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
              --out "$out" "$RUNNER_TEMP/aligned.apk"
            "$build_tools/apksigner" verify "$out"
            files+=("$out")
          done
          gh release upload "$TAG" "${files[@]}" --clobber
