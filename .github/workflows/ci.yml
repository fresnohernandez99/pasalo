# Tests and lints the core, the CLI and the voice crate on every push and pull request.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: ALSA (micrófono y altavoz de las llamadas)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p pasalo-core -p pasalo-cli -p pasalo-call --all-targets -- -D warnings
      - run: cargo test -p pasalo-core -p pasalo-cli -p pasalo-call
