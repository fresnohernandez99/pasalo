[package]
name = "pasalo-web"
version = "1.0.1"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring"] }
pasalo-call = { path = "../crates/pasalo-call", default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
bytes = "1"
blake3 = "1"
n0-future = "0.3"
web-sys = { version = "0.3", features = ["console"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[profile.release.package.unsafe-libopus]
opt-level = 3

[profile.release.package.codec2]
opt-level = 3

[profile.release.package.pasalo-call]
opt-level = 3

[workspace]
