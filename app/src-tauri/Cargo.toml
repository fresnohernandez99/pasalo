[package]
name = "pasalo-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "pasalo_app_lib"
# staticlib y cdylib hacen falta para Android/iOS.
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
bytes = "1"
if-addrs = "0.13"
pasalo-call = { version = "1.0.3", path = "../../crates/pasalo-call" }
pasalo-core = { path = "../../crates/pasalo-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["sync", "rt"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
# Para probar: deja inspeccionar el WebView (también en Android, con
# chrome://inspect o el protocolo de DevTools por adb).
devtools = ["tauri/devtools"]

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
