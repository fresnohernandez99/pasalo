[workspace]
resolver = "3"
members = ["crates/pasalo-core", "crates/pasalo-cli", "crates/pasalo-call", "app/src-tauri"]
# El cliente web (WASM) va aparte: ver web/README.md.
exclude = ["web"]

[workspace.package]
version = "1.0.7"
edition = "2024"
license = "MIT"

# Los códecs de voz sin optimizar no llegan a tiempo real; así también va
# bien la app compilada en modo desarrollo.
[profile.dev.package.unsafe-libopus]
opt-level = 3

[profile.dev.package.codec2]
opt-level = 3

# Lo que se publica: lo más pequeño posible sin frenar lo que corre en
# tiempo real (los códecs y el cifrado van a la máxima optimización).
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[profile.release.package.unsafe-libopus]
opt-level = 3

[profile.release.package.codec2]
opt-level = 3

[profile.release.package.pasalo-call]
opt-level = 3
