[package]
name = "pasalo-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pasalo"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bytes = "1.12.1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
pasalo-call = { version = "1.0.0", path = "../pasalo-call", default-features = false }
pasalo-core = { path = "../pasalo-core" }
serde_json = "1.0.154"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
