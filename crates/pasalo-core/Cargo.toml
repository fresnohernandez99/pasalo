[package]
name = "pasalo-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
blake3 = "1"
gethostname = "0.5"
if-addrs = "0.13"
iroh = "1.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.5", features = ["all"] }
thiserror = "2"
tokio = { version = "1", features = ["net", "io-util", "fs", "time", "sync", "rt", "macros"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
